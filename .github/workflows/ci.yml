name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install -r server/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check server/ tests/ scripts/

      - name: Security audit (bandit)
        run: bandit -c pyproject.toml -r server/ -ll

      - name: Run tests + coverage
        run: pytest tests/ --cov=server --cov-report=term-missing --cov-report=xml
        env:
          # Tests provide their own secrets via monkeypatch fixtures, but set
          # safe defaults so a misconfigured workflow doesn't silently 500.
          FLASK_ENV: development

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

      - name: Pip audit (vulnerable deps)
        if: matrix.python-version == '3.13'
        run: pip-audit -r server/requirements.txt --strict || true
        # Tolerate transitive findings for now; switch to --strict on PRs once clean.

  docker:
    name: Docker image (build only)
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false                       # add login + push when registry is wired
          tags: mansa:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
