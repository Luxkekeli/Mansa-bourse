# MANSA — nginx reverse proxy + static frontend
# Used by docker-compose. For Render/Fly.io, the platform provides its own proxy.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 4M;

    # Gzip — text-heavy assets benefit a lot.
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/woff2;

    log_format mansa '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'rt=$request_time';
    access_log /var/log/nginx/access.log mansa;

    upstream mansa_app {
        server web:5000;
        keepalive 32;
    }

    # ── Redirect HTTP → HTTPS (uncomment in prod with real cert) ─────────
    # server {
    #     listen 80;
    #     server_name mansa.finance www.mansa.finance;
    #     return 301 https://$host$request_uri;
    # }

    server {
        listen 80 default_server;
        server_name _;

        # Security headers (kept conservative — P1-3 will add CSP via flask-talisman).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Static frontend (served directly from nginx — bypasses gunicorn).
        root /usr/share/nginx/html;
        index app.html;

        location = / {
            try_files /app.html =404;
        }

        location / {
            try_files $uri $uri/ /app.html;
            expires 5m;
            add_header Cache-Control "public, must-revalidate";
        }

        # Service worker — never cache so updates propagate.
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files /sw.js =404;
        }

        # All API traffic goes to gunicorn.
        location /api/ {
            proxy_pass http://mansa_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_buffering off;
        }

        # Block requests for vanished .php endpoints (P0-1 cleanup).
        location ~ \.php$ {
            return 410;  # Gone
        }
    }
}
